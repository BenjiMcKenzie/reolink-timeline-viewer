<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }}</title>

  <meta name="theme-color" content="{{ theme_color }}" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{ app_short_name }}" />

  <link rel="manifest" href="{{ base_path }}/manifest.webmanifest?v={{ app_version }}" />
  <link rel="icon" type="image/png" sizes="192x192" href="{{ static_prefix }}/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="{{ static_prefix }}/icons/icon-192.png" />
  <link rel="stylesheet" href="{{ static_prefix }}/styles.css?v={{ app_version }}" />
</head>
<body>
  <div class="app-shell">
    <header class="top-strip">
      <div class="brand">
        <div class="brand-title">{{ app_name }}</div>
        <div class="brand-subtitle">Lokaler Playback-Viewer für Reolink FTP-/Home-Hub-Aufnahmen</div>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="installButton" class="top-action" type="button" style="display:none;">App installieren</button>
        <button id="refreshButton" class="top-action" type="button">Neu laden</button>
      </div>
    </header>

    <main class="main-layout">
      <section class="viewer-column">
        <div class="player-panel">
          <div class="player-topbar">
            <div class="player-heading">
              <div class="player-camera" id="viewerTitle">Kein Ereignis ausgewählt</div>
              <div class="player-meta" id="viewerMeta">Bitte unten ein Ereignis auswählen.</div>
            </div>

            <div class="player-actions">
              <div class="select-wrap">
                <label for="dateSelect">Datum</label>
                <select id="dateSelect"></select>
              </div>

              <div class="select-wrap">
                <label for="cameraSelect">Kamera</label>
                <select id="cameraSelect">
                  <option value="">Alle Kameras</option>
                </select>
              </div>

              <div class="mode-switch">
                <button id="imageModeButton" class="mode-button active" type="button">Foto</button>
                <button id="videoModeButton" class="mode-button" type="button">Video</button>
              </div>
            </div>
          </div>

          <div class="viewer-frame">
            <div id="viewerStage" class="viewer-stage">
              <div class="empty-state">Keine Daten für diese Auswahl gefunden.</div>
            </div>
          </div>
        </div>
      </section>

      <aside class="timeline-column">
        <div class="playback-panel">
          <div class="playback-header">
            <div class="playback-title">
              Wiedergabe
              <span id="selectedMonthLabel">—</span>
            </div>
            <div class="playback-stats">
              <span id="eventCount">0 Ereignisse</span>
            </div>
          </div>

          <div class="day-strip-wrap">
            <div id="dayStrip" class="day-strip"></div>
          </div>

          <div class="timeline-toolbar">
            <div class="timeline-toolbar-left">
              <div class="timeline-range-label" id="timelineRangeLabel">0:00 – 24:00</div>
            </div>

            <div class="timeline-toolbar-right">
              <div class="timeline-nav">
                <button id="timelinePrevButton" class="timeline-nav-button" type="button" onclick="window.timelinePrev()">←</button>
                <button id="timelineNextButton" class="timeline-nav-button" type="button" onclick="window.timelineNext()">→</button>
              </div>

              <div class="zoom-switch">
                <button type="button" class="zoom-button" id="zoom24Button" onclick="window.setTimelineZoom(24)">24h</button>
                <button type="button" class="zoom-button" id="zoom12Button" onclick="window.setTimelineZoom(12)">12h</button>
                <button type="button" class="zoom-button" id="zoom6Button" onclick="window.setTimelineZoom(6)">6h</button>
              </div>
            </div>
          </div>

          <div class="timeline-wrap">
            <div id="timelineTrack" class="timeline-track"></div>
            <div id="timelineScale" class="timeline-scale"></div>
          </div>

          <div class="filmstrip-section">
            <div class="filmstrip-header">Ereignisse</div>
            <div class="filmstrip-wrap">
              <div id="eventsFilmstrip" class="events-filmstrip"></div>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script>window.__APP_CONFIG__ = { basePath: {{ base_path|tojson }}, version: {{ app_version|tojson }} };</script>
  <script src="{{ static_prefix }}/app.js?v={{ app_version }}"></script>
</body>
</html>
