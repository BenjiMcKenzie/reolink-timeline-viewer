services:
  reolink-timeline-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reolink-timeline-viewer
    ports:
      - "8085:8085"
    environment:
      MEDIA_ROOT: /homes/ftp_reolink
      PORT: 8085
    volumes:
      - /homes/ftp_reolink:/homes/ftp_reolink:ro
    restart: unless-stopped
